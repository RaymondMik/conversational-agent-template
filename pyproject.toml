[project]
name = "chatbot"
version = "0.1.0"
description = "Model-agnostic streaming chatbot template built on LiteLLM and Gradio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.50",
    "gradio>=6.0",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
chatbot = "chatbot.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
